<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="targetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Document/Resume Background -->
  <rect x="20" y="20" width="110" height="150" rx="6" fill="url(#docGradient)" stroke="#667eea" stroke-width="2"/>
  
  <!-- Document Lines (Resume Text) -->
  <line x1="35" y1="50" x2="115" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <line x1="35" y1="65" x2="95" y2="65" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="35" y1="78" x2="115" y2="78" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="35" y1="91" x2="110" y2="91" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="35" y1="104" x2="115" y2="104" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="35" y1="117" x2="100" y2="117" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="35" y1="130" x2="115" y2="130" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="35" y1="143" x2="90" y2="143" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <!-- Target/Bullseye Overlay (Bottom Right) -->
  <!-- Outer Ring -->
  <circle cx="135" cy="110" r="50" fill="none" stroke="url(#targetGradient)" stroke-width="3" opacity="0.9"/>
  
  <!-- Middle Ring -->
  <circle cx="135" cy="110" r="35" fill="none" stroke="url(#targetGradient)" stroke-width="2" opacity="0.7"/>
  
  <!-- Inner Ring -->
  <circle cx="135" cy="110" r="20" fill="none" stroke="url(#targetGradient)" stroke-width="2" opacity="0.7"/>
  
  <!-- Center Bullseye -->
  <circle cx="135" cy="110" r="10" fill="url(#targetGradient)" stroke="#f5576c" stroke-width="1.5"/>
  
  <!-- Center White Dot -->
  <circle cx="135" cy="110" r="5" fill="#ffffff"/>

  <!-- Checkmark (Success Indicator) -->
  <g transform="translate(135, 60)">
    <circle cx="0" cy="0" r="12" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
    <polyline points="-4,0 2,6 8,-4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lightning Bolt (AI/Smart) -->
  <g transform="translate(50, 180)">
    <polygon points="0,-8 3,-2 0,0 4,8 -2,2 0,0 -4,-8" fill="#ffc107" stroke="#ff9800" stroke-width="1"/>
  </g>

  <!-- Brand Text -->
  <text x="100" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#667eea" letter-spacing="2">
    SCREENCV
  </text>

  <!-- Tagline -->
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666" opacity="0.8">
    Precision Resume Matching
  </text>
</svg>